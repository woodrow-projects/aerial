# Aerial — single-VM stack (ADR D1: Docker Compose, not Kubernetes).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d
# Reads variables from the repo-root .env (copy from .env.example first).

name: aerial

services:
  postgres:
    image: postgres:16-alpine
    # Optional: only started for an Aerial-managed database. With an external
    # Postgres the installer sets DB_MODE=external and this service stays off
    # (the managed-db profile is not activated). See deploy/install.sh.
    profiles: ["managed-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  icecast:
    # Hosts all channel mountpoints for low-latency/legacy/directory listening.
    # Locked down: never published directly — only reachable via Caddy (ADR D2).
    build:
      context: ../engine/icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
    expose:
      - "8000"

  control-plane:
    # The brain: NestJS API + SPA + engine supervisor that spawns one
    # Liquidsoap child process per channel (ADR D5/D6). Image bundles Node +
    # Liquidsoap + ffmpeg.
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HLS_ROOT: /srv/hls
      MEDIA_ROOT: /srv/media
    depends_on:
      # required:false → in external-DB mode (postgres service off) the control
      # plane still starts and connects to DATABASE_URL; in managed mode it
      # waits for the local Postgres to be healthy first.
      postgres:
        condition: service_healthy
        required: false
      icecast:
        condition: service_started
    volumes:
      - hls:/srv/hls
      - media:/srv/media
    expose:
      - "3000"
    # Liquidsoap harbor ports (8100+) are internal-only: Caddy terminates ingest
    # TLS and proxies to them over the compose network (D10). Not published.

  caddy:
    # Public entrypoint: auto-TLS, serves HLS segments (CDN origin), proxies
    # Icecast + the control plane, and TLS-terminates streamer ingest via layer4 (D10/D11).
    build:
      context: ./caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      # Streamer ingest (TLS-terminated here, proxied to the internal harbors)
      - "8100-8110:8100-8110"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hls:/srv/hls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane
      - icecast

volumes:
  pgdata:
  hls:
  media:
  caddy_data:
  caddy_config:
