# Aerial — single-VM stack (ADR D1: Docker Compose, not Kubernetes).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d
# Reads variables from the repo-root .env (copy from .env.example first).

name: aerial

# Cap container logs. The default json-file driver is UNBOUNDED: Liquidsoap runs
# at log.level 3 piped into the control plane's logger, and Icecast tails its
# access + error logs to stdout, so an unrotated stack fills a small VM's disk and
# takes the station off air. 10 MB × 3 files per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  icecast:
    # Hosts all channel mountpoints for low-latency/legacy/directory listening.
    # Never published directly; Caddy allow-lists the per-channel mount paths and
    # refuses the status/admin surface (ADR D2, and see deploy/caddy/Caddyfile).
    build:
      context: ../engine/icecast
    restart: unless-stopped
    logging: *default-logging
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
    expose:
      - "8000"

  control-plane:
    # The brain: NestJS API + SPA + engine supervisor that spawns one
    # Liquidsoap child process per channel (ADR D5/D6). Image bundles Node +
    # Liquidsoap + ffmpeg.
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      # SQLite database file on the `data` volume (ADR D11, amended). Backup =
      # copy this file (see docs/DEVELOPMENT.md).
      DATABASE_URL: ${DATABASE_URL:-file:/srv/data/aerial.db}
      HLS_ROOT: /srv/hls
      MEDIA_ROOT: /srv/media
    depends_on:
      icecast:
        condition: service_started
    volumes:
      - data:/srv/data
      - hls:/srv/hls
      - media:/srv/media
    expose:
      - "3000"
    # Liquidsoap harbor ports (8100+) are internal-only: Caddy terminates ingest
    # TLS and proxies to them over the compose network (D10). Not published.

  caddy:
    # Public entrypoint: auto-TLS, serves HLS segments (CDN origin), proxies
    # Icecast + the control plane, and TLS-terminates streamer ingest via layer4 (D10/D11).
    build:
      context: ./caddy
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
      # "email" iff ACME_EMAIL is non-empty — see the Caddyfile global block.
      ACME_EMAIL_DIRECTIVE: ${ACME_EMAIL:+email}
    ports:
      - "80:80"
      - "443:443"
      # Streamer ingest (TLS-terminated here, proxied to the internal harbors)
      - "8100-8110:8100-8110"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hls:/srv/hls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane
      - icecast

volumes:
  data:
  hls:
  media:
  caddy_data:
  caddy_config:
