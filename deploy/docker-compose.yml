# Aerial — single-VM stack (ADR D1: Docker Compose, not Kubernetes).
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up -d
# Reads variables from the repo-root .env (copy from .env.example first).

name: aerial

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  icecast:
    # Hosts all channel mountpoints for low-latency/legacy/directory listening.
    # Locked down: never published directly — only reachable via Caddy (ADR D2).
    build:
      context: ../engine/icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
    expose:
      - "8000"

  control-plane:
    # The brain: NestJS API + SPA + engine supervisor that spawns one
    # Liquidsoap child process per channel (ADR D5/D6). Image bundles Node +
    # Liquidsoap + ffmpeg.
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HLS_ROOT: /srv/hls
      MEDIA_ROOT: /srv/media
    depends_on:
      postgres:
        condition: service_healthy
      icecast:
        condition: service_started
    volumes:
      - hls:/srv/hls
      - media:/srv/media
    expose:
      - "3000"
    # DJ ingest (Liquidsoap harbor) ports — one per channel from HARBOR_BASE_PORT.
    # Published so broadcasting software can connect. Widen the range as needed.
    ports:
      - "8100-8110:8100-8110"

  caddy:
    # Public entrypoint: auto-TLS, serves HLS segments (CDN origin), proxies
    # Icecast and the control plane (ADR D11).
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hls:/srv/hls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - control-plane
      - icecast

volumes:
  pgdata:
  hls:
  media:
  caddy_data:
  caddy_config:
